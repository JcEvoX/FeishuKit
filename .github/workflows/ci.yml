name: CI

# 说明（中文）：
#   本 workflow 只做一件事 —— 用仓库自带的 build.sh 把 APK 编出来，产物上传为 Artifact。
#   不发布 Release、不 push 任何代码，因此可以安全地跑在这个专用分支上，不影响 main。
#   触发：任意分支 push（排除自动化分支）+ 任意 PR + 手动触发。
on:
  push:
    branches-ignore:
      - 'automation-schedule-permacache/**'
  pull_request:
  workflow_dispatch:

# 只读权限即可（不写仓库内容、不建 Release）。
permissions:
  contents: read

# 同一分支的旧任务自动取消，省额度。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK (arm64-v8a / debug-signed)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # build.sh 需要 JDK 11+（d8 / apksigner 要求）。
      # 固定 17：GitHub runner 默认就是 17，且能正常处理 -source 8 -target 8 的旧语法。
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ⚠️ 关键：build.sh 用 `sort -V | tail -1` 挑选 build-tools 与 android.jar，
      #   也就是「取最高版本」。而 ubuntu-latest 镜像预装了 android-37.2 / build-tools 37.0.0
      #   （版本随镜像滚动更新），不加约束会直接用它们构建 —— 结果不可复现，
      #   且 android.jar 一换，编译期 API 面就跟着变。
      #   这里先删掉镜像里那些「比 34 更高」的版本，只留我们锁定的 34，
      #   再补装固定的 NDK，从而把整条工具链钉死在 34.0.0 / android-34 / NDK 26.1。
      - name: Pin Android SDK versions (build-tools 34.0.0 / android-34)
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$SDK" || ! -d "$SDK" ]]; then
            echo "::error::ANDROID_HOME 未设置，runner 镜像异常"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK"

          # 1) 清掉镜像自带的、高于 34 的 platform 与 build-tools，避免被 build.sh 的
          #    "取最高版本" 逻辑选中。android-34 若已存在则保留。
          shopt -s nullglob
          for d in "$SDK"/platforms/android-*; do
            v="$(basename "$d")"
            case "$v" in
              android-34|android-34.*) echo "keep $v" ;;
              *) echo "remove $v"; rm -rf "$d" ;;
            esac
          done
          for d in "$SDK"/build-tools/*; do
            v="$(basename "$d")"
            if [[ "$v" == "34.0.0" ]]; then echo "keep build-tools $v"; else echo "remove build-tools $v"; rm -rf "$d"; fi
          done

          # 2) 补装锁定版本（已存在则为幂等空操作）。
          SDKMGR="$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)"
          [[ -n "$SDKMGR" ]] || { echo "::error::找不到 sdkmanager"; exit 1; }
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"

          # 3) 显式导出，让 build.sh 不再依赖自动探测。
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK/ndk/26.1.10909125" >> "$GITHUB_ENV"
          echo "ANDROID_JAR=$SDK/platforms/android-34/android.jar" >> "$GITHUB_ENV"

      - name: Show toolchain versions
        run: |
          set -euo pipefail
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          echo "---"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          echo "ANDROID_JAR=$ANDROID_JAR"
          ls "$ANDROID_HOME/platforms"
          ls "$ANDROID_HOME/build-tools"

      # build.sh 会自动探测 JAVA_HOME / ANDROID_HOME / ANDROID_NDK_HOME / android.jar，
      # 找不到 keystore 时自动生成 debug.keystore 并用 debug key 签名。
      # 这里把 build.sh 的输出同时 tee 到文件，供下一步做工具链断言。
      - name: Build
        run: |
          set -euo pipefail
          chmod +x ./build.sh
          ./build.sh 2>&1 | tee build_log.txt

      - name: Collect outputs
        run: |
          set -euo pipefail

          # 断言：必须命中锁定的工具链，否则宁可失败也不产出「版本漂移」的包。
          if ! grep -q "Build-Tools = .*/build-tools/34\.0\.0" build_log.txt; then
            echo "::error::构建未使用锁定的 build-tools 34.0.0，实际为："
            grep "Build-Tools =" build_log.txt || true
            exit 1
          fi
          if ! grep -q "android.jar = .*/platforms/android-34/android\.jar" build_log.txt; then
            echo "::error::构建未使用锁定的 android-34/android.jar，实际为："
            grep "android.jar =" build_log.txt || true
            exit 1
          fi
          echo "工具链校验通过：build-tools 34.0.0 + android-34 + NDK 26.1.10909125"

          ls -la feishu-antirecall.apk
          sha256sum feishu-antirecall.apk | tee sha256sum.txt
          mkdir -p dist
          cp feishu-antirecall.apk "dist/feishu-antirecall-${GITHUB_SHA::7}.apk"
          cp sha256sum.txt dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: feishu-antirecall-apk-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
