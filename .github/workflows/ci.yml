name: CI

# 说明（中文）：
#   本 workflow 只做一件事 —— 用仓库自带的 build.sh 把 APK 编出来，产物上传为 Artifact。
#   不发布 Release、不 push 任何代码，因此可以安全地跑在这个专用分支上，不影响 main。
#   触发：任意分支 push（排除自动化分支）+ 任意 PR + 手动触发。
on:
  push:
    branches-ignore:
      - 'automation-schedule-permacache/**'
  pull_request:
  workflow_dispatch:

# 只读权限即可（不写仓库内容、不建 Release）。
permissions:
  contents: read

# 同一分支的旧任务自动取消，省额度。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK (arm64-v8a / debug-signed)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # build.sh 需要 JDK 11+（d8 / apksigner 要求）。
      # 固定 17：GitHub runner 默认就是 17，且能正常处理 -source 8 -target 8 的旧语法。
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub 的 ubuntu-latest 镜像自带 Android SDK（ANDROID_HOME 已设），
      # 但自带镜像里的 platform / build-tools 版本会随镜像更新而变，
      # 所以这里显式补装我们构建所需的固定版本，保证构建可复现。
      - name: Install Android SDK platform & build-tools
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$SDK" || ! -d "$SDK" ]]; then
            echo "::error::ANDROID_HOME 未设置，runner 镜像异常"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK"
          SDKMGR="$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)"
          if [[ -z "$SDKMGR" ]]; then
            echo "::error::找不到 sdkmanager"
            exit 1
          fi
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"
          echo "ANDROID_NDK_HOME=$SDK/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Show toolchain versions
        run: |
          set -euo pipefail
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          echo "---"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          ls "$ANDROID_HOME/platforms"
          ls "$ANDROID_HOME/build-tools"

      # build.sh 会自动探测 JAVA_HOME / ANDROID_HOME / ANDROID_NDK_HOME / android.jar，
      # 找不到 keystore 时自动生成 debug.keystore 并用 debug key 签名。
      - name: Build
        run: |
          set -euo pipefail
          chmod +x ./build.sh
          ./build.sh

      - name: Collect outputs
        run: |
          set -euo pipefail
          ls -la feishu-antirecall.apk
          sha256sum feishu-antirecall.apk | tee sha256sum.txt
          mkdir -p dist
          cp feishu-antirecall.apk "dist/feishu-antirecall-${GITHUB_SHA::7}.apk"
          cp sha256sum.txt dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: feishu-antirecall-apk-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
